<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05090d">
  <meta name="description" content="DEFSHOCK2 Item Manager developer documentation with searchable Luau references.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DEFSHOCK2 Item Manager Documentation">
  <meta property="og:description" content="Searchable developer documentation for the DEFSHOCK2 Item Manager.">
  <meta property="og:url" content="https://neurospawn.github.io/Defshock2-Item-Manager-Documentation/">
  <meta property="og:image" content="https://neurospawn.github.io/Defshock2-Item-Manager-Documentation/embed-image.jpg">
  <meta property="og:image:alt" content="DEFSHOCK2 Item Manager documentation artwork">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DEFSHOCK2 Item Manager Documentation">
  <meta name="twitter:description" content="Searchable developer documentation for the DEFSHOCK2 Item Manager.">
  <meta name="twitter:image" content="https://neurospawn.github.io/Defshock2-Item-Manager-Documentation/embed-image.jpg">
  <title>DS2 ITEM MANAGER DOCS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop-art" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Back to the top of the documentation">
      <span class="brand-mark" aria-hidden="true">DS2</span>
      <span><strong>ITEM MANAGER</strong><small>FULL DOCUMENTATION</small></span>
    </a>
    <div class="topbar-actions">
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Search documentation" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <label class="color-setting" for="highlight-color" title="Change highlight color">
        <span>ACCENT</span>
        <input id="highlight-color" type="color" value="#ed4038" aria-label="Choose highlight color">
      </label>
      <button class="icon-button mobile-only" id="outline-toggle" type="button" aria-expanded="false" aria-controls="outline-panel" aria-label="Toggle contents" title="Toggle contents">☰</button>
    </div>
  </header>

  <div class="app-layout" id="top">
    <aside class="sidebar" id="outline-panel" aria-label="Documentation outline">
      <div class="sidebar-heading">
        <span>Index / Contents</span>
        <span class="section-count" id="section-count">0 sections</span>
      </div>
      <nav id="outline" class="outline"><p class="muted">Loading outline...</p></nav>
      <div class="sidebar-footer">
        <span id="reading-time">READING PROGRESS --</span>
        <span id="progress-label">0% SYNCED</span>
      </div>
    </aside>

    <main class="main-content">
      <div class="reading-progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <section class="document-header" aria-labelledby="page-title">
        <p class="eyebrow">// AN IN-DEPTH GUIDE TO GETTING FLIGGITY</p>
        <h1 id="page-title">Documentation</h1>
        <p class="document-meta" id="document-meta">A focused guide for getting fliggity...</p>
      </section>
      <div id="search-status" class="search-status" role="status" aria-live="polite" hidden></div>
      <article id="document" class="document" tabindex="-1">
        <div class="loading-state"><span class="loader" aria-hidden="true"></span>Loading documentation...</div>
      </article>
      <nav class="document-nav" aria-label="Section navigation">
        <button id="previous-section" class="section-button" type="button" disabled><span aria-hidden="true">←</span><span><small>Previous</small><strong>Previous section</strong></span></button>
        <button id="next-section" class="section-button section-button-next" type="button" disabled><span><small>Next</small><strong>Next section</strong></span><span aria-hidden="true">→</span></button>
      </nav>
      <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">↑</button>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
