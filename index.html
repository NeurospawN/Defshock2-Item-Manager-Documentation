<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b1f">
  <title>Documentation Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Back to the top of the documentation">
      <span class="brand-mark" aria-hidden="true">D</span>
      <span><strong>Documentation</strong><small>Navigator</small></span>
    </a>
    <div class="topbar-actions">
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="Search documentation" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">☼</button>
      <button class="icon-button mobile-only" id="outline-toggle" type="button" aria-expanded="false" aria-controls="outline-panel" aria-label="Toggle contents" title="Toggle contents">☰</button>
    </div>
  </header>

  <div class="app-layout" id="top">
    <aside class="sidebar" id="outline-panel" aria-label="Documentation outline">
      <div class="sidebar-heading">
        <span>Contents</span>
        <span class="section-count" id="section-count">0 sections</span>
      </div>
      <nav id="outline" class="outline"><p class="muted">Loading outline...</p></nav>
      <div class="sidebar-footer">
        <span id="reading-time">Reading time --</span>
        <span id="progress-label">0% read</span>
      </div>
    </aside>

    <main class="main-content">
      <div class="reading-progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <section class="document-header" aria-labelledby="page-title">
        <p class="eyebrow">Developer reference</p>
        <h1 id="page-title">Documentation</h1>
        <p class="document-meta" id="document-meta">A focused guide for getting things done.</p>
      </section>
      <div id="search-status" class="search-status" role="status" aria-live="polite" hidden></div>
      <article id="document" class="document" tabindex="-1">
        <div class="loading-state"><span class="loader" aria-hidden="true"></span>Loading documentation...</div>
      </article>
      <nav class="document-nav" aria-label="Section navigation">
        <button id="previous-section" class="section-button" type="button" disabled><span aria-hidden="true">←</span><span><small>Previous</small><strong>Previous section</strong></span></button>
        <button id="next-section" class="section-button section-button-next" type="button" disabled><span><small>Next</small><strong>Next section</strong></span><span aria-hidden="true">→</span></button>
      </nav>
      <button id="back-to-top" class="back-to-top" type="button" aria-label="Back to top" title="Back to top">↑</button>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
